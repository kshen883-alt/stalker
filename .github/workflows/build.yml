name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch setup_service binaries from official release
        run: |
          mkdir -p assets/binaries
          curl -L -o official.apk https://github.com/onerdna/stalker/releases/download/4.0.3/app-arm64-v8a-release.apk
          unzip -o -j official.apk 'assets/flutter_assets/assets/binaries/*' -d assets/binaries
          ls -la assets/binaries
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
